<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafetería - Realizar Pedido</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Desactivar scroll horizontal molesto en móviles */
        body {
            background-color: #f9fafb;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col bg-gray-50 text-gray-800 shadow-lg relative">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-50 px-4 py-3 flex justify-between items-center">
        <div>
            <h1 class="text-xs uppercase tracking-wider text-gray-400 font-bold">Bienvenido a</h1>
            <p class="text-lg font-black text-orange-600 tracking-tight">CAFETERIA ESPECIAL</p>
        </div>
        <div class="bg-orange-100 border border-orange-200 px-3 py-1.5 rounded-full text-center">
            <span class="text-xs text-orange-700 font-bold block leading-none">MESA</span>
            <span class="text-sm font-black text-orange-800 font-mono" id="number-table">04</span>
        </div>
    </header>

    <main class="flex-1 p-4 space-y-6 pb-40">

        <div>
            <h2 class="text-xl font-extrabold text-gray-900">Tu Pedido Actual</h2>
            <p class="text-xs text-gray-500">Revisa los detalles antes de enviar a la cocina.</p>
        </div>

        <div class="space-y-4" id="cart-list">

            <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm space-y-3">
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="font-bold text-gray-900 text-base">Hamburguesa Angus</h3>
                        <p class="text-xs text-gray-400">Pan artesanal, carne 150g, queso cheddar.</p>
                        <p class="text-sm font-extrabold text-orange-600 mt-1">$22,000</p>
                    </div>
                    <div class="flex items-center space-x-2 bg-gray-100 rounded-lg p-1">
                        <button class="w-7 h-7 bg-white text-gray-700 rounded-md font-bold shadow-sm active:bg-gray-200">-</button>
                        <span class="font-mono font-bold text-sm px-1">2</span>
                        <button class="w-7 h-7 bg-white text-gray-700 rounded-md font-bold shadow-sm active:bg-gray-200">+</button>
                    </div>
                </div>

                <div class="pt-2 border-t border-gray-100">
                    <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wide">💡 Notas para el Chef:</label>
                    <input type="text"
                           placeholder="Ej: Término 3/4, sin cebolla, doble porción de carne (+ valor)..."
                           value="Sin cebolla, término tres cuartos."
                           class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition-all">
                </div>
            </div>

            <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm space-y-3">
                <div class="flex justify-between items-start">
                    <div>
                        <h3 class="font-bold text-gray-900 text-base">Papas Supremas</h3>
                        <p class="text-xs text-gray-400">Papas rústicas con tocino y salsa de queso.</p>
                        <p class="text-sm font-extrabold text-orange-600 mt-1">$12,000</p>
                    </div>
                    <div class="flex items-center space-x-2 bg-gray-100 rounded-lg p-1">
                        <button class="w-7 h-7 bg-white text-gray-700 rounded-md font-bold shadow-sm active:bg-gray-200">-</button>
                        <span class="font-mono font-bold text-sm px-1">1</span>
                        <button class="w-7 h-7 bg-white text-gray-700 rounded-md font-bold shadow-sm active:bg-gray-200">+</button>
                    </div>
                </div>

                <div class="pt-2 border-t border-gray-100">
                    <label class="block text-xs font-bold text-gray-500 mb-1 uppercase tracking-wide">💡 Notas para el Chef:</label>
                    <input type="text"
                           placeholder="Ej: Salsa por separado, bien tostadas..."
                           class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition-all">
                </div>
            </div>

        </div>

        <!-- <div class="bg-blue-50 border border-blue-100 rounded-xl p-3 flex items-start space-x-2.5">
            <span class="text-base">🔔</span>
            <p class="text-xs text-blue-700 font-medium leading-normal">
                Al confirmar, tu pedido se enviará de inmediato a las pantallas de la cocina. Podrás pedir más cosas más tarde si lo deseas.
            </p>
        </div> -->
    </main>

    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 p-4 rounded-t-3xl shadow-[0_-8px_30px_rgb(0,0,0,0.04)] z-50">
        <div class="flex justify-between items-center mb-4 px-1">
            <div>
                <span class="text-xs text-gray-400 block font-bold uppercase">Total a pagar</span>
                <span class="text-2xl font-black text-gray-900 font-mono">$56,000</span>
            </div>
            <div class="text-right">
                <span class="text-xs text-gray-400 block">Items: <strong class="text-gray-700">3</strong></span>
                <span class="text-xs text-gray-400 block">Mesa: <strong class="text-gray-700">#04</strong></span>
            </div>
        </div>

        <button onclick="enviarACocina()" class="w-full bg-gradient-to-r cursor-pointer from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-extrabold text-base py-4 rounded-2xl shadow-lg shadow-orange-500/20 active:scale-[0.98] transition-transform text-center uppercase tracking-wider flex justify-center items-center space-x-2">
            <a href="/Interfaz_Cocina.html">
                <span>🚀 Confirmar y pedir</span>
            </a>

        </button>
    </div>

    <script>
        // Simulación de captura del parámetro Mesa desde el QR (ej: ?mesa=4)
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const mesa = urlParams.get('mesa');
            if (mesa) {
                document.getElementById('number-table').innerText = mesa.padStart(2, '0');
            }
        });

        function enviarACocina() {
            // Animación/Feedback visual rápido de éxito antes de procesar
            alert('¡Orden confirmada! Tu pedido ha sido enviado con éxito a la cocina de la mesa ' + document.getElementById('number-table').innerText);

            // Aquí conectarías tu WebSocket o petición POST hacia la base de datos (MongoDB/PostgreSQL)
            /*
            fetch('/api/pedidos', {
                method: 'POST',
                body: JSON.stringify({
                    mesa: 4,
                    items: [...]
                })
            });
            */
        }
    </script>
</body>
</html>
